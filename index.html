<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CAES9821 · Square Enix 长期 AI 建议：演示答辩包与证据工作页，顶部切换。">
<title>CAES9821｜Square Enix 长期 AI 建议</title>
<style>
:root{--ink:#172535;--muted:#586779;--line:#d5dee8;--bg:#f6f8fb;--paper:#fff;--accent:#1a4c70;--soft:#eaf2f8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}

.top{flex:0 0 auto;display:flex;align-items:flex-end;gap:22px;background:var(--ink);padding:0 18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.brand{color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap;padding-bottom:12px;flex:0 0 auto}
.brand em{font-style:normal;color:#8fb0c9;font-weight:400;margin-left:8px}
.tabs{display:flex;gap:3px;flex:1 1 auto;min-width:0}
.tab{flex:0 0 auto;font:inherit;font-size:13.5px;font-weight:600;color:#9fb4c6;background:transparent;border:0;border-radius:8px 8px 0 0;padding:11px 16px 10px;cursor:pointer;white-space:nowrap;transition:background .14s,color .14s}
.tab:hover:not([aria-selected="true"]){background:rgba(255,255,255,.07);color:#d6e2ec}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:700}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#3f8f7a;margin-right:7px;vertical-align:2px}

.stage{flex:1 1 auto;position:relative;background:var(--bg);min-height:0}
.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
.pane.on{display:block}

.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--bg);z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
.loading.show{opacity:1}

@media(max-width:760px){
  .brand{display:none}
  .tab{font-size:12.5px;padding:10px 12px 9px}
  .top{padding:0 10px}
}
</style>
</head>
<body>

<div class="top">
  <span class="brand">CAES9821<em>Square Enix · 长期 AI 建议</em></span>
  <div class="tabs" role="tablist" aria-label="材料切换">
    <button class="tab" role="tab" data-tab="pack" aria-selected="false">演示与答辩包</button>
    <button class="tab" role="tab" data-tab="paged" aria-selected="false"><span class="dot"></span>证据工作页 · 分页</button>
    <button class="tab" role="tab" data-tab="full" aria-selected="false">证据工作页 · 全文</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="loading" id="loading">载入中…</div>
  <iframe class="pane" data-pane="pack" title="演示与答辩包" data-src="04_AI_Defense_Copy_Boxes.html"></iframe>
  <iframe class="pane" data-pane="paged" title="证据工作页 分页阅读" data-src="evidence.html"></iframe>
  <iframe class="pane" data-pane="full" title="证据工作页 全文" data-src="Square_Enix_Long_Term_AI_Evidence.html"></iframe>
</div>

<script>
(function(){
  var ORDER = ['pack', 'paged', 'full'];
  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var panes = {};
  [].slice.call(document.querySelectorAll('.pane')).forEach(function(p){ panes[p.dataset.pane] = p; });
  var loading = document.getElementById('loading');
  var current = null;

  function paneByKey(k){ return panes[k]; }

  function ensureLoaded(pane){
    if (!pane) return;
    var src = pane.getAttribute('src');
    if (!src) {
      var real = pane.dataset.src;
      if (real) {
        loading.classList.add('show');
        pane.addEventListener('load', function once(){
          pane.removeEventListener('load', once);
          loading.classList.remove('show');
        });
        pane.setAttribute('src', real);
      }
    }
  }

  function select(key, fromHash){
    if (ORDER.indexOf(key) < 0) key = 'paged';
    if (key === current && !fromHash) return;

    tabs.forEach(function(t){
      var on = t.dataset.tab === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });

    [].slice.call(document.querySelectorAll('.pane')).forEach(function(p){
      p.classList.toggle('on', p.dataset.pane === key);
    });

    ensureLoaded(paneByKey(key));

    // 切片切换后让内部重新计算尺寸（evidence.html 里有嵌套 iframe）
    var pane = paneByKey(key);
    if (pane) {
      try {
        if (pane.contentWindow) {
          pane.contentWindow.dispatchEvent(new Event('resize'));
        }
      } catch (e) {}
    }

    current = key;
    if (history.replaceState) history.replaceState(null, '', '#' + key);
    document.title = 'CAES9821｜' + ({
      pack: '演示与答辩包',
      paged: '证据工作页 · 分页',
      full: '证据工作页 · 全文'
    })[key];
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ select(t.dataset.tab); });
    t.addEventListener('keydown', function(e){
      var i = ORDER.indexOf(t.dataset.tab);
      if (e.key === 'ArrowRight') { e.preventDefault(); var n = ORDER[(i + 1) % ORDER.length]; select(n); tabs.forEach(function(x){ if (x.dataset.tab === n) x.focus(); }); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); var p = ORDER[(i - 1 + ORDER.length) % ORDER.length]; select(p); tabs.forEach(function(x){ if (x.dataset.tab === p) x.focus(); }); }
    });
  });

  var start = (location.hash || '').replace('#', '');
  select(ORDER.indexOf(start) >= 0 ? start : 'paged', true);

  window.addEventListener('hashchange', function(){
    var k = (location.hash || '').replace('#', '');
    if (ORDER.indexOf(k) >= 0) select(k, true);
  });
})();
</script>
</body>
</html>

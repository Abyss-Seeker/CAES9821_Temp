<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Square Enix 长期 AI 建议证据工作页 · 分页阅读版">
<title>Square Enix｜长期 AI 建议 · 分页阅读</title>
<style>
:root{--ink:#172535;--muted:#586779;--line:#d5dee8;--bg:#f6f8fb;--paper:#fff;--accent:#1a4c70;--soft:#eaf2f8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--paper);border-bottom:1px solid var(--line);z-index:10}
.brand{font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;border-right:1px solid var(--line);padding-right:12px}
.titles{flex:1 1 auto;min-width:0}
.titles b{display:block;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles span{display:block;font-size:11px;color:var(--muted)}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:5px;flex:0 0 auto}
.dots a{width:25px;height:25px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:11px;text-decoration:none;font-weight:700}
.dots a:hover{border-color:var(--accent);color:var(--accent)}
.dots a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{font-size:11px;color:var(--muted);white-space:nowrap}
.frame{flex:1 1 auto;border:0;width:100%;background:var(--bg)}
.msg{position:absolute;inset:auto 0 0;text-align:center;padding:40px;color:var(--muted)}
@media(max-width:900px){.hint{display:none}}
@media(max-width:700px){.brand{display:none}.dots a{width:22px;height:22px;font-size:10px}button{padding:6px 9px}.titles span{display:none}}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">CAES9821 · 分页阅读</span>
  <div class="titles"><b id="ptitle">载入中…</b><span id="pmeta"></span></div>
  <div class="dots" id="dots"></div>
  <button id="prev" aria-label="上一页">←</button>
  <button id="next" aria-label="下一页">→</button>
  <span class="hint">← → / J K 翻页</span>
</div>
<iframe class="frame" id="doc" src="Square_Enix_Long_Term_AI_Evidence.html" title="证据工作页正文"></iframe>
<script>
(function(){
  var SRC = 'Square_Enix_Long_Term_AI_Evidence.html';
  var frame = document.getElementById('doc');
  var dots = document.getElementById('dots');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var titleEl = document.getElementById('ptitle');
  var metaEl = document.getElementById('pmeta');

  var secs = [], header = null, doc = null, idx = 0, searching = false;

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function label(sec, i){
    var h2 = sec.querySelector('h2');
    var t = h2 ? h2.textContent.trim() : (sec.id || ('第 ' + (i+1) + ' 节'));
    return t;
  }

  function buildDots(){
    dots.innerHTML = '';
    secs.forEach(function(sec, i){
      var a = document.createElement('a');
      a.href = '#p' + (i+1);
      a.textContent = (i+1);
      a.title = label(sec, i);
      a.addEventListener('click', function(e){ e.preventDefault(); go(i); });
      dots.appendChild(a);
    });
  }

  function paintDots(){
    [].forEach.call(dots.children, function(a, i){
      a.classList.toggle('on', i === idx);
    });
  }

  function showAll(){
    secs.forEach(function(s){ s.style.display = ''; });
    if (header) header.style.display = '';
  }

  function applyPage(){
    if (searching) return;
    secs.forEach(function(s, i){ s.style.display = (i === idx) ? '' : 'none'; });
    if (header) header.style.display = (idx === 0) ? '' : 'none';
  }

  function go(i, keepScroll){
    if (!secs.length) return;
    idx = Math.max(0, Math.min(secs.length - 1, i));
    applyPage();
    paintDots();
    titleEl.textContent = label(secs[idx], idx);
    metaEl.textContent = '第 ' + (idx + 1) + ' / ' + secs.length + ' 页 · 页内可继续滚动';
    prevBtn.disabled = (idx === 0);
    nextBtn.disabled = (idx === secs.length - 1);
    if (!keepScroll) {
      try { frame.contentWindow.scrollTo({ top: 0, behavior: 'instant' }); } catch (e) { frame.contentWindow.scrollTo(0, 0); }
      window.scrollTo(0, 0);
    }
    if (history.replaceState) history.replaceState(null, '', '#p' + (idx + 1));
  }

  function wireNav(){
    // 把原文件里 sticky 目录的锚点改成翻页
    var navLinks = doc.querySelectorAll('nav a[href^="#"], .chips a[href^="#"]');
    [].forEach.call(navLinks, function(a){
      a.addEventListener('click', function(e){
        var id = (a.getAttribute('href') || '').slice(1);
        if (!id) return;
        var target = doc.getElementById(id);
        if (!target) return;
        // 找到该锚点所属的 section
        var owner = target.closest ? target.closest('section') : null;
        if (!owner) return;
        var pos = secs.indexOf(owner);
        if (pos < 0) return;
        e.preventDefault();
        searching = false;
        go(pos);
        // 页内定位到具体条目
        setTimeout(function(){
          try { target.scrollIntoView({ behavior: 'instant', block: 'start' }); } catch (err) { target.scrollIntoView(); }
        }, 30);
      });
    });
  }

  function wireSearch(){
    var input = doc.getElementById('search');
    var clear = doc.getElementById('clear-search');
    if (!input) return;
    function onInput(){
      var q = (input.value || '').trim();
      searching = q.length > 0;
      if (searching) { showAll(); } else { applyPage(); }
    }
    input.addEventListener('input', onInput);
    if (clear) clear.addEventListener('click', function(){ setTimeout(onInput, 0); });
  }

  function boot(){
    try {
      doc = frame.contentDocument || frame.contentWindow.document;
    } catch (e) {
      titleEl.textContent = '无法读取正文（同源限制）';
      return;
    }
    header = doc.querySelector('header');
    secs = [].slice.call(doc.querySelectorAll('main > section'));
    if (!secs.length) secs = [].slice.call(doc.querySelectorAll('section'));
    if (!secs.length) { titleEl.textContent = '未找到章节'; return; }

    // 隐藏原文件的 sticky 目录，避免和外层翻页条重复
    var innerNav = doc.querySelector('body > nav');
    if (innerNav) innerNav.style.display = 'none';
    // 补偿 scroll-padding
    try { doc.documentElement.style.scrollPaddingTop = '12px'; } catch (e) {}

    buildDots();
    wireNav();
    wireSearch();

    // 支持 ?p=3 或 #p3 直链
    var start = 0;
    var m = /(?:^|[#&?])p(\d+)/.exec(location.hash + ' ' + location.search);
    if (m) start = parseInt(m[1], 10) - 1;
    go(start || 0);

    // 原文件的「复制」按钮等脚本已随 innerHTML 自动执行，无需额外处理
  }

  frame.addEventListener('load', boot);
  if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.contentDocument.querySelector('section')) boot();

  prevBtn.addEventListener('click', function(){ go(idx - 1); });
  nextBtn.addEventListener('click', function(){ go(idx + 1); });

  document.addEventListener('keydown', function(e){
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft' || e.key === 'k' || e.key === 'K') { e.preventDefault(); go(idx - 1); }
    if (e.key === 'ArrowRight' || e.key === 'j' || e.key === 'J') { e.preventDefault(); go(idx + 1); }
    if (e.key === 'Home') { e.preventDefault(); go(0); }
    if (e.key === 'End') { e.preventDefault(); go(secs.length - 1); }
  });

  // 触屏左右滑动翻页
  var tx = 0, ty = 0;
  document.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function(e){
    if (e.changedTouches.length !== 1) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) go(idx + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();
</script>
</body>
</html>
